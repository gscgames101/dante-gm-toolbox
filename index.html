<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body><title>Dante's GM Toolbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style id="appStyle">
/* Layout: one-screen app. Phone = list OR stat block; tablet = list pane + stat block pane. Dice tray docked at the bottom. */
:root {
  --bg: #e7e9e1;
  --surface: #f5f6f1;
  --sunk: #dcdfd5;
  --ink: #1d2320;
  --muted: #5a645c;
  --line: #c6ccc0;
  --accent: #8c1d22;
  --accent-ink: #ffffff;
  --accent-soft: #8c1d2214;
  --good: #2c7a4b;
  --bad: #a3361b;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111412; --surface: #191d1a; --sunk: #0c0e0d; --ink: #e4e8e1; --muted: #98a299;
    --line: #2c332e; --accent: #e2676c; --accent-ink: #1b0a0b; --accent-soft: #e2676c1f;
    --good: #6cc490; --bad: #f08a6a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111412; --surface: #191d1a; --sunk: #0c0e0d; --ink: #e4e8e1; --muted: #98a299;
  --line: #2c332e; --accent: #e2676c; --accent-ink: #1b0a0b; --accent-soft: #e2676c1f;
  --good: #6cc490; --bad: #f08a6a; color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.45; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.app { height: 100%; display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 1.45rem; letter-spacing: .02em; color: var(--accent); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .brand h1 { font-size: 1.2rem; } .brand .sync { display: none; } }
.sync { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.sync[data-state="live"]::before { background: var(--good); }
.sync[data-state="warn"]::before { background: var(--bad); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: .9rem; }

/* Panes */
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
.pane { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.app[data-view="list"] #detailPane { display: none; }
.app[data-view="detail"] #listPane { display: none; }
@media (min-width: 820px) {
  .panes { grid-template-columns: minmax(300px, 360px) 1fr; }
  .app[data-view] #listPane, .app[data-view] #detailPane { display: block; }
  #listPane { border-right: 1px solid var(--line); }
  .back { display: none !important; }
}

/* List */
.list-tools { position: sticky; top: 0; z-index: 2; background: var(--bg); display: grid; gap: 10px; padding-block: 12px 10px; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.search { min-width: 0; }
.search input { width: 0; }  /* lets the box shrink so the sort menu and + New always fit */
.search .btn { height: 42px; flex: none; white-space: nowrap; padding: 0 12px; }
.search select { height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: .88rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mlist { list-style: none; margin: 0; padding: 0 0 16px; display: grid; gap: 2px; }
.mrow { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; text-align: left; padding: 10px; border: 0; border-radius: var(--radius); background: transparent; }
.thumb { grid-row: 1 / span 2; grid-column: 1; width: 46px; height: 46px; border-radius: 8px; object-fit: cover; background: var(--sunk); display: grid; place-items: center; font-family: var(--display); font-size: 1.3rem; color: var(--muted); overflow: hidden; }
.mrow .nm, .mrow .sub { grid-column: 2; }
.sb-img { display: block; width: 100%; padding: 0; margin: 0 0 14px; border: 0; border-radius: 4px; background: var(--sunk); overflow: hidden; cursor: zoom-in; }
.sb-img img { display: block; width: 100%; max-height: 360px; object-fit: cover; }
.lightbox { background: #000000e6; display: grid; place-items: center; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pic-ed { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.pic-prev { width: 112px; height: 112px; border-radius: 8px; border: 1px dashed var(--line); background: var(--sunk); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: .8rem; text-align: center; }
.pic-prev img { width: 100%; height: 100%; object-fit: cover; }
.pic-btns { display: grid; gap: 6px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.mrow:hover { background: var(--sunk); }
.mrow[aria-current="true"] { background: var(--accent-soft); }
.mrow .nm { grid-column: 2; grid-row: 1; justify-self: start; max-width: 100%; font-weight: 700; font-size: 1.05rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .sub { grid-column: 2; font-size: .86rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .cr { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-variant-numeric: tabular-nums; }
.cr b { display: block; font-family: var(--mono); font-size: 1rem; color: var(--accent); }
.cr span { font-size: .74rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.list-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 8px 20px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }
.empty { padding: 28px 4px; color: var(--muted); }
.empty h3 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; color: var(--ink); margin-bottom: 6px; }

/* Stat block */
.detail-wrap { padding-block: 12px 32px; }
.detail-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.detail-bar .spacer { flex: 1; }
.sb { max-width: 720px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-bottom: 4px solid var(--accent); border-radius: 4px; padding: 16px 18px 20px; }
.sb-name { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.1; color: var(--accent); }
.sb-meta { font-style: italic; color: var(--muted); margin: 2px 0 0; }
.taper { height: 5px; margin: 12px 0; background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%); border: 0; }
.core { display: grid; gap: 4px; margin: 0; }
.core div, .props div { display: flex; flex-wrap: wrap; gap: 0 6px; }
.core dt, .props dt { font-weight: 700; color: var(--accent); }
.core dd, .props dd { margin: 0; min-width: 0; }
.hp-track { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--sunk); }
.hp-now { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; min-width: 5.5ch; font-variant-numeric: tabular-nums; }
.hp-now small { color: var(--muted); font-weight: 500; font-size: .85rem; }
.hp-now.low { color: var(--bad); }
.hp-track input { width: 4.5em; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); text-align: center; }
.hp-bar { flex-basis: 100%; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.hp-bar i { display: block; height: 100%; background: var(--good); transition: width .2s; }
.hp-bar i.low { background: var(--bad); }
.abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 0; }
@media (max-width: 440px) { .abil { grid-template-columns: repeat(3, 1fr); } }
.abil button { display: grid; gap: 0; justify-items: center; padding: 6px 2px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-variant-numeric: tabular-nums; }
.abil button:hover { border-color: var(--accent); }
.abil .k { font-size: .72rem; font-weight: 700; letter-spacing: .1em; color: var(--accent); }
.abil .v { font-size: 1.05rem; font-weight: 700; }
.abil .m { font-family: var(--mono); font-size: .82rem; color: var(--muted); }
.props { display: grid; gap: 4px; margin: 0; }
.sec-h { font-family: var(--display); font-weight: 400; font-size: 1.35rem; color: var(--accent); border-bottom: 1px solid var(--accent); margin: 18px 0 8px; padding-bottom: 2px; }
.entry { margin: 0 0 10px; white-space: pre-line; }
.entry b { font-style: italic; }
.intro { margin: 0 0 10px; color: var(--ink); white-space: pre-line; }
.roll { font: inherit; font-family: var(--mono); font-size: .9em; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 4px; padding: 0 4px; margin: 0 1px; line-height: 1.4; }
.roll:hover { background: var(--accent); color: var(--accent-ink); }
.notes { max-width: 720px; margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; white-space: pre-line; }
.notes h3 { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.placeholder { padding: 48px 8px; color: var(--muted); max-width: 40ch; }

/* Dice tray */
.tray { border-top: 1px solid var(--line); background: var(--surface); padding-block: 8px; }
.tray-row { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { min-height: 36px; padding: 0 9px; border: 0; background: transparent; font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.last { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.last .tot { font-family: var(--mono); font-weight: 700; font-size: 1.6rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.last .tot.crit { color: var(--good); }
.last .tot.fumble { color: var(--bad); }
.last .what { min-width: 0; font-size: .82rem; line-height: 1.25; color: var(--muted); }
.last .what b { color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.last .what span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: .76rem; }
.pop { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(1.35); } to { transform: none; } }
.tray-more { padding-top: 10px; display: grid; gap: 10px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { min-width: 48px; min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-weight: 700; font-size: .85rem; }
.log { list-style: none; margin: 0; padding: 0; max-height: 9.5em; overflow-y: auto; font-size: .85rem; display: grid; gap: 2px; }
.log li { display: flex; gap: 8px; justify-content: space-between; color: var(--muted); }
.log li b { font-family: var(--mono); color: var(--ink); }

/* Sheets (editor, backup, confirm) */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-in { max-width: 760px; margin: 0 auto; padding-block: 12px 40px; }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.sheet-head h2 { flex: 1; font-family: var(--display); font-weight: 400; font-size: 1.4rem; color: var(--accent); min-width: 0; }
fieldset { border: 0; padding: 0; margin: 0 0 22px; display: grid; gap: 12px; }
legend { font-family: var(--display); font-size: 1.15rem; color: var(--accent); padding: 0; margin-bottom: 10px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .erow input, .erow textarea, .sheet textarea {
  width: 100%; min-height: 42px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
textarea { resize: vertical; min-height: 76px; line-height: 1.4; }
.hint { font-size: .8rem; color: var(--muted); }
.abil-ed { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
@media (max-width: 520px) { .abil-ed { grid-template-columns: repeat(3, 1fr); } }
.abil-ed .field input { text-align: center; font-variant-numeric: tabular-nums; }
.hd-ed { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .hd-ed { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hd-ed .field input, .hd-ed .field select { text-align: center; font-variant-numeric: tabular-nums; }
.hd-ed input::placeholder { color: var(--muted); opacity: 1; }
.hd-ed output, .abil-ed output { text-align: center; font-family: var(--mono); font-size: .82rem; color: var(--muted); }
.srows { display: grid; gap: 8px; }
.srows:empty { display: none; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto 76px auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.srow select, .srow input { width: 100%; min-height: 40px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.srow input { text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.srow input::placeholder { color: var(--muted); opacity: 1; }
.srow .seg button { min-height: 38px; }
@media (max-width: 460px) {
  .srow { grid-template-columns: auto minmax(0, 1fr) auto; }
  .srow select { grid-column: 1 / -1; }
}
.srow.s3 { grid-template-columns: minmax(0, 1fr) 84px auto; }
.srow.s3 select { grid-column: auto; }
.field.narrow { max-width: 260px; }
.pick-group { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.pick-group summary { cursor: pointer; padding: 10px 12px; font-weight: 700; min-height: 44px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pick-sum { font-weight: 400; color: var(--muted); font-size: .88rem; min-width: 0; }
.pick-group .picker { padding: 0 12px 12px; }
.picker { display: grid; gap: 10px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips.wrap .chip { min-height: 36px; }
.chip[data-pk][aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.add-custom { display: flex; gap: 8px; }
.add-custom input { flex: 1; min-width: 0; min-height: 38px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.exp-mark { font-size: .7em; color: var(--muted); vertical-align: super; margin-left: 1px; }
.erows { display: grid; gap: 10px; }
.erow { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.erow-top { display: flex; gap: 6px; }
.erow-top input { flex: 1; min-width: 0; font-weight: 700; }
.err { color: var(--bad); font-size: .9rem; }
.confirm-box { max-width: 420px; margin: 20vh auto 0; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: grid; gap: 14px; }
.sheet.dim { background: color-mix(in srgb, var(--bg) 70%, transparent); }
.row-end { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* Books: leather-bound tiles on a shelf. Covers are their own dark material, so they read the same in both themes. */
:root { --cover-ink: #f4ecd8; --cover-rule: #f4ecd873; --page-a: #efe6cf; --page-b: #d6cbb1; --spine: #00000047; --spine-hi: #ffffff14; }
.shelf { display: flex; gap: 14px; overflow-x: auto; padding: 16px 6px 12px 2px; margin: 0 -2px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.book { flex: none; position: relative; width: 5.75rem; height: 8rem; border: 0; border-radius: 3px 8px 8px 3px;
  background: var(--book, #3d4a52); color: var(--cover-ink); padding: 10px 9px 8px 17px;
  display: flex; flex-direction: column; justify-content: space-between; text-align: left;
  box-shadow: inset 7px 0 0 var(--spine), inset 9px 0 0 var(--spine-hi), 3px 4px 10px #0000002e; transition: transform .15s ease; }
.book::after { content: ""; position: absolute; top: 6px; bottom: 6px; right: -4px; width: 4px; border-radius: 0 2px 2px 0;
  background: repeating-linear-gradient(to bottom, var(--page-a) 0 2px, var(--page-b) 2px 3px); }
.book-title { font-family: var(--display); font-size: 1rem; line-height: 1.12; overflow-wrap: anywhere; padding: 5px 0;
  border-top: 1px solid var(--cover-rule); border-bottom: 1px solid var(--cover-rule);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.book-count { font-family: var(--mono); font-size: .74rem; opacity: .8; }
.book:hover { transform: translateY(-3px); }
.book[aria-pressed="true"] { transform: translateY(-6px); outline: 2px solid var(--accent); outline-offset: 3px; }
.book-all { --book: var(--ink); color: var(--bg); --cover-rule: currentColor; }
.book-new { background: transparent; color: var(--muted); border: 2px dashed var(--line); box-shadow: none; justify-content: center; align-items: center; text-align: center; padding: 8px; font-weight: 700; }
.book-new::after { display: none; }
.book-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .92rem; color: var(--muted); }
.book-bar b { color: var(--ink); font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.book-bar .spacer { flex: 1; }
.dlg-h { font-family: var(--display); font-weight: 400; font-size: 1.35rem; color: var(--accent); }
.book-dlg { max-width: 480px; }
.book-dlg-row { display: flex; gap: 16px; align-items: flex-start; }
.book-dlg-fields { flex: 1; min-width: 0; display: grid; gap: 12px; }
.book-preview { pointer-events: none; }

/* ---------- normalize ---------- */
const str = v => (v == null ? '' : String(v)).trim();

function normalize(o) {

    speed: str(o.speed) || '30 ft.',

    tags: (Array.isArray(o.tags) ? o.tags : str(o.tags).split(',')).map(str).filter(Boolean),

  SECTIONS.forEach(([k]) => m[k] = entries(o[k]));

  m.skillList = Array.isArray(o.skillList) ? cleanSkills(o.skillList) : parseSkills(m.skills, m);
  if (m.skillList.length || Array.isArray(o.skillList)) m.skills = skillsText(m);

    const p = parseSenses(m.senses);

  m.speedList = has('speedList') ? cleanSpeeds(o.speedList) : cleanSpeeds(parseSpeeds(m.speed));
  m.speed = speedText(m.speedList);

/* ---------- hit points ---------- */
const HIT_DIE = [4, 6, 8, 10, 12, 20];
const SIZE_DIE = { Tiny: 4, Small: 6, Medium: 8, Large: 10, Huge: 12, Gargantuan: 20 };

function hpFormulaText(m) {
  if (!m.hdCount) return '';

  return `${m.hdCount}d${m.hdDie}${b ? ` ${b > 0 ? '+' : '−'} ${Math.abs(b)}` : ''}`;
}
/* ---------- speed ---------- */
const MOVES = ['walk', 'burrow', 'climb', 'fly', 'swim'];
function cleanSpeeds(a) {
  const seen = new Set();
  return (Array.isArray(a) ? a : []).filter(s => s && str(s.mode)).map(s => {
    const lc = str(s.mode).toLowerCase();
    const mode = MOVES.includes(lc) ? lc : str(s.mode).slice(0, 60);
    const ft = intOrNull(s.ft);
    return { mode, ft: ft != null && ft >= 0 ? ft : null, hover: mode === 'fly' && !!s.hover };
  }).filter(s => !seen.has(s.mode) && seen.add(s.mode))
    .sort((x, y) => { const r = v => { const i = MOVES.indexOf(v.mode); return i < 0 ? 99 : i; }; return r(x) - r(y); });
}
function parseSpeeds(t) {
  const out = [];
  str(t).split(/[,;]/).map(str).filter(Boolean).forEach(p => {
    let mm = p.match(/^(\d+)\s*ft/i);
    if (mm) { out.push({ mode: 'walk', ft: +mm[1] }); return; }
    mm = p.match(/^(walk|burrow|climb|fly|swim)\s+(\d+)\s*ft\.?\s*(\(hover\))?/i);
    if (mm) out.push({ mode: mm[1], ft: +mm[2], hover: !!mm[3] });
    else out.push({ mode: p, ft: null });
  });

}
function speedText(list) {
  const parts = list.map(s => {
    const dist = s.ft != null ? `${s.ft} ft.` : '';
    if (s.mode === 'walk') return dist || '0 ft.';
    if (!MOVES.includes(s.mode)) return s.ft != null ? `${s.mode} ${dist}` : s.mode;
    return `${s.mode} ${dist || '0 ft.'}${s.hover ? ' (hover)' : ''}`;
  });
  if (list.length && list[0].mode !== 'walk') parts.unshift('0 ft.');
  return parts.join(', ') || '0 ft.';
}
/* ---------- list helpers ---------- */
const isDash = s => /^(—|–|-|none)$/i.test(s);
function splitList(t) { return str(t).split(/[,;]/).map(s => str(s).replace(/^and\s+/i, '')).filter(s => s && !isDash(s)); }
function cleanStrList(a, opts) {
  const vals = opts.map(o => o[0]), seen = new Set();
  const out = (Array.isArray(a) ? a : []).map(v => { v = str(v); return vals.find(x => x.toLowerCase() === v.toLowerCase()) || v.slice(0, 80); })
    .filter(v => v && !isDash(v) && !seen.has(v.toLowerCase()) && seen.add(v.toLowerCase()));
  const rank = v => { const i = vals.indexOf(v); return i < 0 ? 999 : i; };
  return out.map((v, i) => [v, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);
}
function parseDamage(t) {
  const out = [];
  str(t).split(';').map(str).filter(Boolean).forEach(p => {
    if (/nonmagical|from |that aren|silvered|adamantine/i.test(p)) out.push(/^bludgeoning,? piercing,? and slashing from nonmagical attacks$/i.test(p) ? BPS : p);
    else splitList(p).forEach(s => out.push(s));

}
function dmgText(list) { return list.join(list.some(x => x.includes(',')) ? '; ' : ', '); }

  let tele = 0; const list = [];
  splitList(t).forEach(p => { const mm = p.match(/^telepathy\s*(\d+)/i); if (mm) tele = +mm[1]; else list.push(p); });
  return { list, tele };
}
function languagesText(m) {
  const parts = [...m.langList];

}
function cleanSaves(a) {
  const seen = new Set();
  return (Array.isArray(a) ? a : []).map(s => ({ ab: str(s && s.ab).toLowerCase().slice(0, 3), bonus: intOrNull(s && s.bonus) }))
    .filter(s => ABIL.includes(s.ab) && !seen.has(s.ab) && seen.add(s.ab))
    .sort((x, y) => ABIL.indexOf(x.ab) - ABIL.indexOf(y.ab));
}
function saveAuto(m, s) { return mod(m[s.ab]) + pb(m.cr); }
function savesText(m) { return m.saveList.map(s => `${ABBR(s.ab)} ${fmt(s.bonus != null ? s.bonus : saveAuto(m, s))}`).join(', '); }
function parseSaves(t, m) {
  const out = [];
  splitList(t).forEach(p => {
    const mm = p.match(/^(str|dex|con|int|wis|cha)[a-z]*\s*([+\-−]\s*\d+)$/i);
    if (!mm) return;
    const s = { ab: mm[1].toLowerCase(), bonus: intOrNull(mm[2].replace(/\s/g, '')) };
    if (s.bonus === saveAuto(m, s)) s.bonus = null;
    out.push(s);

}
function cleanSenses(a) {
  const seen = new Set();
  return (Array.isArray(a) ? a : []).filter(s => s && str(s.sense)).map(s => {
    const sense = SENSES.find(x => x.toLowerCase() === str(s.sense).toLowerCase()) || str(s.sense).slice(0, 80);
    const r = intOrNull(s.range);

}
function parseSenses(t) {

    const pp = p.match(/passive perception\s*(\d+)/i);

  const parts = m.senseList.map(s => SENSES.includes(s.sense)
    ? `${s.sense.toLowerCase()}${s.range ? ` ${s.range} ft.` : ''}${s.blind ? ' (blind beyond this radius)' : ''}`
    : s.sense);

function canonSkill(n) { n = str(n); return SKILL_NAMES.find(s => s.toLowerCase() === n.toLowerCase()) || n.slice(0, 40); }
function cleanSkills(list) {
  const seen = new Set();
  return list.filter(s => s && str(s.skill)).map(s => {
    const b = parseInt(String(s.bonus ?? '').replace('−', '-'), 10);
    return { skill: canonSkill(s.skill), level: s.level === 'exp' ? 'exp' : 'prof', bonus: Number.isFinite(b) ? b : null };

/* ---------- dice ---------- */
function die(f) { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % f) + 1; }

    state.enc.log = [{ id: uid(), who, label: label || 'Roll', pretty, rolls, total, crit, round: state.enc.round || 0, t: Date.now() }, ...log].slice(0, 20);
    encChanged();
    schedulePlayersUpdate(450);  // straight to the players (an attack + damage tapped together go as one)
  }
  // The dice tray is hidden under full-screen sheets, so show the result there too.
  if (document.querySelector('.sheet:not([hidden]):not(#sbSheet)')) toast(`${label || 'Roll'}: ${total}${crit === 'crit' ? ' (nat 20!)' : crit === 'fumble' ? ' (nat 1)' : ''}  ·  ${pretty} → [${rolls.join(', ')}]`);
}
function renderTray(animate) {
  const r = state.log[0];
  if (r) {

    $('#last').innerHTML = `<span class="tot ${r.crit}${animate ? ' pop' : ''}">${r.total}</span><span class="what"><b>${esc(r.label)}</b><span>${esc(detail)}</span></span>`;
  }

}

/* Turn dice text into roll buttons. Works on already-escaped text. */
function linkify(t) {
  return t.replace(/(?<![A-Za-z#&\d])(?:([+\-−]\d+)(?=\s+to hit)|(?<=Attack Roll:\s?)([+\-−]\d+)|(\d*)d(\d+)((?:\s*[+\-−]\s*\d+)?)(?![A-Za-z\d]))/g,
    (m, hit1, hit2, n, f, k) => {
      if (hit1 || hit2) { const b = (hit1 || hit2).replace('−', '-'); return `<button type="button" class="roll" data-roll="1d20${b}" data-kind="attack">${m}</button>`; }
      const expr = `${n || 1}d${f}${(k || '').replace(/\s|−/g, s => s === '−' ? '-' : '')}`;
      return `<button type="button" class="roll" data-roll="${expr}" data-kind="damage">${m}</button>`;
    });
}
/* Saving throws and skills: "Dex +5" → roll d20+5 */
function linkifyBonuses(t) {
  return t.replace(/([+\-−]\d+)(?!\d)/g, b => `<button type="button" class="roll" data-roll="1d20${b.replace('−', '-')}" data-kind="check">${b}</button>`);
}

async function saveBook(e) {
  e.preventDefault();
  const name = str($('#bookName').value).slice(0, 40);
  if (!name) { showErr('#bookErr', 'Give the book a title.'); $('#bookName').focus(); return; }
  if (!state.db) { showErr('#bookErr', 'Not connected, so the book can’t be saved right now.'); return; }
  const old = state.books.find(b => b.id === state.bookEditing);
  const ref = old ? state.db.collection('books').doc(old.id) : state.db.collection('books').doc();
  $('#bookSave').disabled = true;
  try {
    await ref.set({ name, color: state.bookColor, createdAt: old ? old.createdAt || Date.now() : Date.now() });
    $('#bookSheet').hidden = true;
    if (!old && state.quickFor) {
      // made from the quick popup: file the monster in it and go back to the popup
      if (!state.books.some(b => b.id === ref.id)) state.books.push({ id: ref.id, name, color: state.bookColor });
      state.qbIds = [...state.qbIds, ref.id];
      setMonsterBooks(state.quickFor, state.qbIds);
      const m = state.monsters.find(x => x.id === state.quickFor);
      toast(`Created “${name}” and added ${m ? m.name : 'the monster'}`);
      renderQuickBooks(); $('#qbSheet').hidden = false;
      renderShelf(); renderList();
      return;
    }
    state.book = ref.id;
    toast(old ? 'Book saved' : `Created “${name}”`);
    renderShelf(); renderList();
  } catch (err) { showErr('#bookErr', saveErrorText(err)); }
  finally { $('#bookSave').disabled = false; }
}
async function deleteBook(id) {
  const b = state.books.find(x => x.id === id); if (!b || !state.db) return;
  try {
    await state.db.collection('books').doc(id).delete();
    if (state.book === id) state.book = 'all';
    // take the book off its monsters (the monsters themselves stay)
    for (const m of state.monsters.filter(x => inBook(x, id))) {
      await state.db.collection('monsters').doc(m.id).update({ bookIds: m.bookIds.filter(x => x !== id) });
    }
    toast(`Deleted “${b.name}”`);
  } catch (err) { toast(saveErrorText(err)); }
}

function filtered() {
  const q = state.q.toLowerCase().trim();
  let arr = state.monsters.filter(m => {
    if (state.book !== 'all' && !inBook(m, state.book)) return false;
    if (state.type !== 'all' && (m.type || '').toLowerCase() !== state.type) return false;
    if (!q) return true;
    return [m.name, m.type, m.subtype, m.alignment, (m.tags || []).join(' '), 'cr ' + m.cr].join(' ').toLowerCase().includes(q);
  });
  const byName = (a, b) => a.name.localeCompare(b.name);
  if (state.sort === 'name') arr.sort(byName);
  else if (state.sort === 'cr') arr.sort((a, b) => crNum(a.cr) - crNum(b.cr) || byName(a, b));
  else if (state.sort === 'crd') arr.sort((a, b) => crNum(b.cr) - crNum(a.cr) || byName(a, b));
  else arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return arr;
}

function sbHtml(m, withTracker) {

        <div><dt>Initiative</dt><dd><button type="button" class="roll" data-roll="1d20${sig(dexMod)}" data-label="Initiative">${fmt(dexMod)}</button></dd></div>
      </dl>
      ${withTracker ? `<div class="hp-track" aria-label="Hit point tracker">
        <span class="hp-now" id="hpNow"></span>

      <hr class="taper">

/* Pictures: a full-size copy (max 1000px, about 100-200 KB) for the stat block, and a 96px thumbnail

async function decodeImage(blob) {
  try { return await createImageBitmap(blob); }
  catch {
    return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(blob); });

async function encode(canvas, quality) {
  // WebP is much smaller; browsers that can't write it fall back to JPEG.
  const webp = await new Promise(r => canvas.toBlob(r, 'image/webp', quality));
  if (webp && webp.type === 'image/webp') return webp;

  if (file.size < 150 * 1024 && w <= max && h <= max && ['image/jpeg', 'image/webp'].includes(file.type)) return file;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);

/* Pictures added before thumbnails existed: make their thumbnails quietly in the background, one at a time. */
const thumbDone = new Set(); let thumbBusy = false;
async function backfillThumbs() {
  if (thumbBusy || !state.assets || !state.db || !state.canWrite || state.role !== 'dm') return;
  thumbBusy = true;

    for (const m of [...state.monsters]) {
      if (!isAssetId(m.image) || isAssetId(m.thumb) || thumbDone.has(m.id)) continue;
      thumbDone.add(m.id);
      try {
        const r = await fetch(imgSrc(m.image));
        if (!r.ok) continue;
        const tb = await makeThumb(await r.blob());
        if (!tb) continue;
        const up = await state.assets.upload(tb);

        for (const x of state.monsters.filter(x => x.image === m.image && !isAssetId(x.thumb))) {
          await state.db.collection('monsters').doc(x.id).update({ thumb: up.id });

/* ---------- paste a stat block ---------- */
// Reads a stat block copied as plain text (2014 or 2024 layout) into the same raw shape the app imports,
// then normalize() turns its text lines (saves, skills, senses…) into the editor's rows.
function parseStatBlock(text) {
  let src = String(text || '').replace(/\r/g, '').replace(/ /g, ' ').replace(/[‒–−]/g, '-').replace(/[‘’]/g, "'").replace(/[ \t]+/g, ' ');
  // Homebrewery / GM Binder markdown: "> ## Name", "**Armor Class** 15", "***Bite.*** …", "|STR|DEX|…|" tables
  src = src.replace(/^[ \t]*>+[ \t]?/gm, '').replace(/^#+\s*/gm, '').replace(/^[ \t]*[-•][ \t]+(?=\*)/gm, '')
    .replace(/\*{1,3}|_{2,3}/g, '').replace(/^[ \t]*[-•][ \t]+(?=[A-Z])/gm, '').replace(/\|/g, ' ').replace(/:-+:?/g, ' ').replace(/[ \t]+/g, ' ');
  let lines = src.split('\n').map(s => s.trim()).filter(s => s && !/^[-_=—:\s]+$/.test(s));
  // PDF copies split words at line ends ("attack-\nrolls")
  for (let i = 0; i < lines.length - 1; i++) {
    if (/[a-z]-$/.test(lines[i]) && /^[a-z]/.test(lines[i + 1])) { lines[i] = lines[i].slice(0, -1) + lines[i + 1]; lines.splice(i + 1, 1); i--; }
  }
  const raw = { traits: [], actions: [], bonus: [], reactions: [], legendary: [], lair: [], legendaryIntro: '', lairIntro: '' };
  const found = [];
  if (!lines.length) return { raw, found };
  raw.name = lines[0].replace(/[.:]+$/, '');
  const SIZE = /^((?:tiny|small|medium|large|huge|gargantuan)(?:\s+or\s+\w+)?)\s+(.+?),\s*(.+)$/i;
  const SECT = { 'traits': 'traits', 'special traits': 'traits', 'actions': 'actions', 'bonus actions': 'bonus', 'reactions': 'reactions', 'legendary actions': 'legendary', 'lair actions': 'lair', 'mythic actions': 'legendary' };
  const HEAD = [
    ['ac', /^(?:armor class|ac)\b[:\s]*(.*)$/i], ['hp', /^(?:hit points|hp)\b[:\s]*(.*)$/i], ['speed', /^speed\b[:\s]*(.*)$/i],
    ['saves', /^(?:saving throws|saves)\b[:\s]*(.*)$/i], ['skills', /^skills\b[:\s]*(.*)$/i],
    ['vuln', /^(?:damage )?vulnerabilities\b[:\s]*(.*)$/i], ['resist', /^(?:damage )?resistances\b[:\s]*(.*)$/i],
    ['immune', /^damage immunities\b[:\s]*(.*)$/i], ['condImmune', /^condition immunities\b[:\s]*(.*)$/i], ['immunities', /^immunities\b[:\s]*(.*)$/i],
    ['senses', /^senses\b[:\s]*(.*)$/i], ['languages', /^languages\b[:\s]*(.*)$/i], ['cr', /^(?:challenge(?: rating)?|cr)\b[:\s]*(.*)$/i],
    ['skip', /^(?:proficiency bonus|pb|initiative|gear)\b/i]
  ];
  const head = {};
  // A trait/action starts with a short Title Case name and a period: "Multiattack.", "Fire Breath (Recharge 5-6)."
  const entryStart = line => {
    const m = line.match(/^([A-Z0-9][^.!?]{0,80}?(?:\([^)]*\))?)\.\s+(\S.*)$/) || line.match(/^([A-Z0-9][^.!?]{0,80}?(?:\([^)]*\))?)\.$/);
    if (!m) return null;
    const words = m[1].replace(/\([^)]*\)/g, ' ').replace(/[:,]/g, ' ').trim().split(/\s+/).filter(Boolean);
    if (!words.length || words.length > 7) return null;
    const small = /^(of|the|and|a|an|in|to|with|on|or|for|per|from|at|by|into|vs)$/i;
    if (!words.every((w, i) => /^[A-Z0-9'"]/.test(w) || (i > 0 && small.test(w)))) return null;
    return { name: m[1].trim(), desc: (m[2] || '').trim() };
  };
  const listLine = l => /^(cantrips|at will|\d+(st|nd|rd|th) level|\d+\/day|[•\-*]\s)/i.test(l);
  // Ability scores: "18 (+4)" six times after the STR label, or the 2024 table "Str 18 +4 +8".
  const blob = lines.join('\n');
  const abil = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
  const strAt = blob.search(/\bSTR\b/i);
  if (strAt >= 0) {
    const scores = [...blob.slice(strAt).matchAll(/(\d{1,2})\s*\(\s*([+-]\s*\d+)\s*\)/g)].slice(0, 6).map(m => +m[1]);
    if (scores.length === 6) abil.forEach((k, i) => raw[k] = scores[i]);
    else {
      const saves = [];
      abil.forEach(k => {
        const m = blob.match(new RegExp('\\b' + k + '\\b\\s*(\\d{1,2})(?:\\s*([+-]\\d+)\\s*([+-]\\d+))?', 'i'));
        if (m) { raw[k] = +m[1]; if (m[3] && m[2] !== m[3]) saves.push(`${k[0].toUpperCase() + k.slice(1)} ${m[3]}`); }
      });
      if (saves.length) head.saves2024 = saves.join(', ');
    }
    if (abil.every(k => raw[k])) found.push('ability scores');
  }
  let section = null, cur = null, lastHead = null;
  const isAbilityLine = l => /^(str|dex|con|int|wis|cha|mod|save)\b/i.test(l) || /^[\d\s()+-]+$/.test(l);
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i];
    const sec = SECT[l.toLowerCase().replace(/[:.]$/, '')];
    if (sec) { section = sec; cur = null; lastHead = null; continue; }
    if (!section) {
      if (!raw.size) { const m = l.match(SIZE); if (m) { raw.size = m[1].split(/\s+/)[0]; raw.typeLine = m[2]; raw.alignment = m[3]; lastHead = null; continue; } }
      const h = HEAD.find(([, re]) => re.test(l));
      if (h) { if (h[0] !== 'skip') { head[h[0]] = l.match(h[1])[1].trim(); lastHead = h[0]; } else lastHead = null; continue; }
      if (isAbilityLine(l)) { lastHead = null; continue; }
      // a wrapped header line ("…slashing from" / "nonmagical attacks")
      if (lastHead && (/^[a-z(]/.test(l) || /[,;]$|\b(and|or|from|that)$/.test(head[lastHead]))) { head[lastHead] += ' ' + l; continue; }
      if (!raw.size && i <= 2 && !entryStart(l)) continue;  // stray subtitle under the name
    }
    const target = section || 'traits';
    const e = entryStart(l);
    if (e && !/^legendary action uses/i.test(e.name)) {
      cur = { name: e.name, desc: e.desc };
      raw[target].push(cur);
      continue;
    }
    if (cur) { cur.desc += (listLine(l) ? '\n' : (cur.desc ? ' ' : '')) + l; continue; }
    if (target === 'legendary' || target === 'lair') { raw[target + 'Intro'] += (raw[target + 'Intro'] ? ' ' : '') + l; continue; }
    cur = { name: '', desc: l }; raw[target].push(cur);
  }
  // header values -> raw fields
  if (raw.typeLine) {
    const m = raw.typeLine.match(/^(.+?)\s*\(([^)]*)\)\s*$/);
    const t = (m ? m[1] : raw.typeLine).trim();
    raw.type = t.charAt(0).toUpperCase() + t.slice(1); raw.subtype = m ? m[2].charAt(0).toUpperCase() + m[2].slice(1) : '';
    raw.alignment = raw.alignment.replace(/\b([a-z])/g, c => c.toUpperCase());
    found.push('size, type and alignment');
  }
  if (head.ac) { const m = head.ac.match(/^(\d+)\s*(?:\(([^)]*)\))?/); if (m) { raw.ac = +m[1]; raw.acNote = m[2] || ''; found.push('armor class'); } }
  if (head.hp) { const m = head.hp.match(/^(\d+)\s*(?:\(([^)]*)\))?/); if (m) { raw.hp = +m[1]; raw.hpFormula = (m[2] || '').replace(/\s+/g, ''); found.push('hit points'); } }
  if (head.speed) { raw.speed = head.speed; found.push('speed'); }
  raw.saves = head.saves || head.saves2024 || '';
  raw.skills = head.skills || '';
  raw.vuln = head.vuln || ''; raw.resist = head.resist || ''; raw.immune = head.immune || ''; raw.condImmune = head.condImmune || '';
  if (head.immunities) {  // 2024: "Necrotic, Poison; Charmed, Poisoned"
    const condNames = COND_OPTS.map(o => o[0].toLowerCase());
    head.immunities.split(';').map(s => s.trim()).filter(Boolean).forEach(part => {
      const items = part.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      if (items.every(x => condNames.includes(x))) raw.condImmune = [raw.condImmune, part].filter(Boolean).join(', ');
      else raw.immune = [raw.immune, part].filter(Boolean).join('; ');
    });
  }
  raw.senses = (head.senses || '').replace(/;/g, ',');
  raw.languages = !head.languages || /^[-—\s]+$/.test(head.languages) ? '—' : head.languages;
  if (head.cr) { const m = head.cr.match(/^(\d+\/\d+|\d+)/); if (m) { raw.cr = m[1]; found.push('challenge rating'); } }
  if (raw.saves) found.push('saving throws');
  if (raw.skills) found.push('skills');
  if (raw.senses) found.push('senses');
  [['traits', 'trait'], ['actions', 'action'], ['bonus', 'bonus action'], ['reactions', 'reaction'], ['legendary', 'legendary action'], ['lair', 'lair action']]
    .forEach(([k, w]) => { const n = raw[k].length; if (n) found.push(`${n} ${w}${n === 1 ? '' : 's'}`); });
  delete raw.typeLine;
  return { raw, found };
}
function pasteFill() {
  const text = $('#pasteTxt').value;
  const msg = $('#pasteMsg');
  if (!str(text)) { msg.hidden = false; msg.className = 'err'; msg.textContent = 'Paste a stat block into the box first.'; return; }
  const { raw, found } = parseStatBlock(text);
  if (!raw.name || found.length < 2) { msg.hidden = false; msg.className = 'err'; msg.textContent = 'That doesn’t look like a stat block. Paste the whole block, from the name down to the last action.'; return; }
  // keep the picture and books already chosen in this editor
  const keep = { image: state.edImage, thumb: state.edThumb, uploaded: state.edUploaded, editing: state.editingId };
  raw.image = keep.image; raw.thumb = keep.thumb;
  raw.bookIds = [...document.querySelectorAll('#edBooks [data-bk][aria-pressed="true"]')].map(b => b.dataset.bk);
  const prev = state.monsters.find(x => x.id === keep.editing);
  if (prev) raw.tags = prev.tags; if (prev && prev.notes) raw.notes = prev.notes;
  openEditor(normalize(raw), keep.editing);
  state.edUploaded = keep.uploaded;
  setTimeout(() => { state.edBaseline = ''; }, 0);  // pasted content counts as unsaved changes (runs after openEditor's own snapshot)
  const missing = ['ability scores', 'armor class', 'hit points', 'challenge rating'].filter(x => !found.includes(x));
  const box = $('#pasteBox'); box.open = true;
  $('#pasteTxt').value = text;
  msg.hidden = false; msg.className = 'hint ok';
  msg.textContent = `Filled in: ${found.join(', ')}.` + (missing.length ? ` Couldn’t find: ${missing.join(', ')}; please fill those in.` : ' Check it over, then tap Save.');
}

/* Read a picture of a stat block: Claude transcribes it into the box, then the normal importer runs. */
const READ_PROMPT = 'This image shows a D&D 5e creature stat block that I own and want to type into my personal GM app. '
  + 'Transcribe its text exactly as written, as plain text. Layout: the name on the first line; then size, type and alignment; '
  + 'then Armor Class, Hit Points and Speed lines; then a line "STR DEX CON INT WIS CHA" followed by one line with the six scores written like "18 (+4)"; '
  + 'then the remaining header lines (Saving Throws, Skills, Damage Vulnerabilities/Resistances/Immunities, Condition Immunities, Senses, Languages, Challenge), each on its own line; '
  + 'then each trait as "Name. text"; then the section headings (Actions, Bonus Actions, Reactions, Legendary Actions, Lair Actions) each on its own line, with every entry as "Name. text". '
  + 'Join words that were split across lines. Output only the transcription, with no commentary or markdown. '
  + 'If the image does not contain a stat block, reply with exactly: NO STAT BLOCK';
let readCtl = null;
async function readPicture(file) {
  const msg = $('#pasteMsg'), box = $('#pasteTxt');
  if (!state.sample || !state.sampleImages) { msg.hidden = false; msg.className = 'err'; msg.textContent = 'Reading pictures isn’t available here. Paste the text instead.'; return; }
  if (!file || !/^image\/(png|jpeg|webp|gif)$/.test(file.type)) { msg.hidden = false; msg.className = 'err'; msg.textContent = 'That file isn’t a picture. Use a PNG, JPG, WebP or GIF.'; return; }
  readCtl = new AbortController();
  $('#pasteBox').open = true;
  box.value = ''; box.classList.add('reading'); box.readOnly = true;
  msg.hidden = false; msg.className = 'hint'; msg.textContent = 'Reading the picture… this can take up to a minute.';
  $('#pasteStop').hidden = false; $('#pasteGo').disabled = true;
  try {
    const { text, truncated } = await state.sample(READ_PROMPT, {
      images: [file], signal: readCtl.signal,
      onText: ({ text }) => { box.value = text; box.scrollTop = box.scrollHeight; }
    });
    box.value = text;
    if (/^\s*NO STAT BLOCK\s*$/i.test(text)) { msg.className = 'err'; msg.textContent = 'No stat block found in that picture. Try a clearer screenshot of the whole block.'; return; }
    pasteFill();
    if (truncated) { const m = $('#pasteMsg'); m.textContent += ' The picture was long, so the end may be missing; check the last actions.'; }
  } catch (e) {
    const c = e && e.code;
    if (e && e.text) box.value = e.text;
    msg.className = c === 'cancelled' ? 'hint' : 'err';
    msg.textContent = c === 'cancelled' ? 'Stopped. You can fix the text and tap Fill in the form.'
      : c === 'not_granted' || c === 'sampling_disabled' ? 'Claude isn’t allowed to read pictures for this app. You can still paste text.'
      : c === 'image_rejected' ? 'That picture couldn’t be read (too big or an unsupported type). Try a smaller screenshot.'
      : c === 'rate_limited' ? 'Too many requests right now. Try again in a minute.'
      : c === 'refused' ? 'Claude couldn’t transcribe that picture. Paste the text instead.'
      : c === 'session_expired' ? 'Your Claude session expired. Sign in again, then try.'
      : 'Couldn’t read the picture. Check your connection and try again.';
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'images_unavailable') { state.sampleImages = false; $('#pasteImgRow').hidden = true; }
  } finally {
    readCtl = null; box.classList.remove('reading'); box.readOnly = false;
    $('#pasteStop').hidden = true; $('#pasteGo').disabled = false;
  }
}

/* ---------- DM notes auto-format ---------- */
// Tidies text pasted from PDFs and websites: rejoins broken lines, fixes split words, neat bullets, clean spacing.
function formatNotes(text) {
  let t = String(text || '').replace(/\r/g, '').replace(/ /g, ' ').replace(/\t/g, ' ');
  t = t.replace(/[ ]+$/gm, '').replace(/^[ ]+/gm, '');
  t = t.replace(/([a-z])-\n([a-z])/g, '$1$2');  // a word split across lines by a PDF ("chal-\nlenge") becomes whole again
  const bullet = /^(?:[•●▪◦‣∙·*\-–—]|\d+[.)])\s+/;
  const heading = l => l.length <= 60 && !/[.!?,;]$/.test(l) && (/:$/.test(l) || /^[A-Z0-9][^a-z]*$/.test(l) || l.split(' ').every(w => /^[A-Z0-9(&'"]/.test(w) || /^(of|the|and|a|an|in|to|on|for|at)$/i.test(w)));
  const paras = t.split(/\n\s*\n+/);
  const out = paras.map(p => {
    const lines = p.split('\n').map(l => l.replace(/\s{2,}/g, ' ').trim()).filter(Boolean);
    const res = [];
    for (const l of lines) {
      const isBullet = bullet.test(l);
      const prev = res[res.length - 1];
      const startsNew = !prev || isBullet || heading(l) || heading(prev) || /[.!?:]["')\]]?$/.test(prev) && /^[A-Z"'(]/.test(l);
      if (startsNew) res.push(isBullet ? l.replace(/^(?:[•●▪◦‣∙·*\-–—])\s+/, '• ') : l);
      else res[res.length - 1] = prev + ' ' + l;
    }
    return res.map(l => l
      .replace(/\s+([,;:!?]|\.(?!\.))/g, '$1')
      .replace(/ {2,}/g, ' ')
      .replace(/^(• |\d+[.)] )?([a-z])/, (m, b, c) => (b || '') + c.toUpperCase())).join('\n');
  });
  return out.filter(Boolean).join('\n\n').trim();
}
let notesUndo = null;
function toggleNotesFormat() {
  const ta = $('#f-notes'), btn = $('#notesFmtBtn'), msg = $('#notesFmtMsg');
  if (notesUndo != null) { ta.value = notesUndo; notesUndo = null; btn.textContent = 'Auto-format'; msg.textContent = 'Restored your original text.'; return; }
  const before = ta.value, after = formatNotes(before);
  if (!before.trim()) { msg.textContent = 'Nothing to format yet.'; return; }
  if (after === before) { msg.textContent = 'Already tidy.'; return; }
  ta.value = after; notesUndo = before;
  btn.textContent = 'Undo'; msg.textContent = 'Formatted. Tap Undo to get your original text back.';
}

/* ---------- backup / import: one JSON file with the monsters, books, player groups and their pictures ----------
   The claude.ai app exports it and can import it back (adds and updates, never deletes).
   The website imports it as a replacement (it's a copy of the app) and can export it too. */
function openBackup() {

    ? 'Saves one file with everything on the website: monsters, books, player groups and their pictures.'
    : 'Saves one file with all your monsters, books, player groups and their pictures. Keep it as a backup, or import it on the website to play there.';
  $('#importHint').textContent = SITE
    ? 'Choose a file exported from the claude.ai app. The website’s monsters, books and groups are replaced with the ones in the file. Your current fight stays.'
    : 'Choose a backup file. Its monsters, books and groups are added, and ones you already have are updated. Nothing is deleted.';

  $('#siteExportMsg').hidden = true; $('#siteImportMsg').hidden = true;

const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function dataUrlToBlob(d) {
  const [head, body] = d.split(',');
  const bin = atob(body), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: (head.match(/^data:([^;]+)/) || [])[1] || 'image/jpeg' });
}
// A picture as a data URL (the website reads it from its database).
async function picData(id) {
  if (SITE) return SITE.picData(id);
  const r = await fetch(imgSrc(id)); if (!r.ok) throw new Error('missing');
  return blobToDataUrl(await r.blob());
}
function siteMsg(sel, text, bad) { const el = $(sel); el.hidden = false; el.className = bad ? 'err' : 'hint'; el.textContent = text; }
async function exportForSite() {
  const btn = $('#siteExportBtn'); btn.disabled = true;
  try {
    const ids = new Set(), add = v => { if (isAssetId(v)) ids.add(v); };
    state.monsters.forEach(m => { add(m.image); add(m.thumb); });
    state.groups.forEach(g => (g.players || []).forEach(p => { add(p.image); add(p.thumb); }));
    const assets = {}; let i = 0, missing = 0;
    for (const id of ids) {
      siteMsg('#siteExportMsg', `Packing pictures… ${++i} of ${ids.size}`);
      try { assets[id] = await picData(id); } catch { missing++; }
    }
    const data = { format: 'dante-gm-toolbox', version: 1, at: Date.now(), monsters: state.monsters, books: state.books, groups: state.groups, assets };
    const json = JSON.stringify(data);
    const name = `dante-gm-toolbox-${new Date().toISOString().slice(0, 10)}.json`;
    const note = `${state.monsters.length} monsters, ${state.books.length} books, ${state.groups.length} groups, ${Object.keys(assets).length} pictures${missing ? ` (${missing} couldn’t be read)` : ''}.`;
    if (SITE) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);

    }

      catch (e) { if (e && e.code === 'declined') { siteMsg('#siteExportMsg', 'Download cancelled.'); return; } }
    }
    await navigator.clipboard.writeText(json);
    siteMsg('#siteExportMsg', `Downloads aren’t available here, so the export was copied instead: ${note}`);
  } catch (e) {
    siteMsg('#siteExportMsg', 'The export didn’t finish. Try again.', true);
  } finally { btn.disabled = false; }
}
async function importFile(file) {
  const input = $('#siteImportFile');

  // Older backups: one monster, or a plain list of monsters. Each is added as a new entry.
  if (Array.isArray(data) || (data && !data.format && data.name)) {
    const list = (Array.isArray(data) ? data : [data]).filter(x => x && typeof x === 'object' && x.name);
    if (!list.length) { siteMsg('#siteImportMsg', 'No monsters found in that file.', true); return; }

    return;
  }
  if (!data || data.format !== 'dante-gm-toolbox' || !Array.isArray(data.monsters)) { siteMsg('#siteImportMsg', 'That file isn’t a Dante’s GM Toolbox export. Choose the .json file you exported.', true); return; }
  const monsters = data.monsters.filter(m => m && m.id && m.name), books = (data.books || []).filter(b => b && b.id && b.name), groups = (data.groups || []).filter(g => g && g.id);
  const assets = Object.entries(data.assets || {}).filter(([id, d]) => isAssetId(id) && typeof d === 'string' && d.startsWith('data:image/'));
  const what = `${monsters.length} monsters, ${books.length} books, ${groups.length} groups and ${assets.length} pictures`;
  if (SITE) showConfirm(`Replace the website’s bestiary with this file? ${what}. Your current fight stays.`, 'Replace', () => replaceFromFile(monsters, books, groups, assets));
  else showConfirm(`Import this file? ${what}. Ones you already have are updated; nothing is deleted.`, 'Import', () => mergeFromFile(monsters, books, groups, assets));
}
async function addMonsterList(list) {
  let ok = 0;
  try {
    for (const m of list) { const { id, ...rest } = m; await state.db.collection('monsters').doc().set(normalize(rest)); siteMsg('#siteImportMsg', `Adding monsters… ${++ok} of ${list.length}`); }

      let done = 0;
      const queue = assets.slice();

async function onGrpFile(e) {

async function uploadPlayerPic(pid, file) {
  const p = state.grp && state.grp.players.find(x => x.id === pid);
  if (!file || !p) return;
  if (p.uploading) return;
  if (!state.assets) { showErr('#grpErr', 'Pictures can only be added by the toolbox owner.'); return; }
  if (!file.type.startsWith('image/')) { showErr('#grpErr', 'That file isn’t a picture. Pick a JPG, PNG, WebP or GIF.'); return; }
  readGrpNames(); p.uploading = true; renderGrpPlayers();
  try {
    const blob = await prepareImage(file);
    const res = await state.assets.upload(blob, blob.type ? undefined : { type: 'image/jpeg' });
    state.grpUploaded.push(res.id);
    let th = '';
    try { const tb = await makeThumb(blob); if (tb) { const tr = await state.assets.upload(tb); state.grpUploaded.push(tr.id); th = tr.id; } } catch {}
    p.image = res.id; p.thumb = th;
  } catch (err) {
    showErr('#grpErr', err && err.code === 'too_large' ? 'That picture is too big (20 MB max).' : 'Couldn’t upload the picture. Check your connection and try again.');
  }
  readGrpNames(); p.uploading = false; renderGrpPlayers();
}
/* A picture can be shared (a duplicated group, the current fight), so only delete it when nothing uses it. */
function assetUsed(id) {

async function saveGroup(e) {
  e.preventDefault(); readGrpNames();

  if (!name) { showErr('#grpErr', 'Give the group a name.'); $('#grpName').focus(); return; }
  if (!players.length) { showErr('#grpErr', 'Add at least one player with a name.'); return; }
  if (!state.db) { showErr('#grpErr', 'Not connected, so the group can’t be saved right now.'); return; }
  const old = state.groups.find(g => g.id === state.grp.id);
  const ref = old ? state.db.collection('groups').doc(old.id) : state.db.collection('groups').doc();
  const data = { name, players, createdAt: old ? old.createdAt || Date.now() : Date.now() };
  $('#grpSave').disabled = true;
  try {
    await ref.set(data);
    const keep = new Set(players.flatMap(p => [p.image, p.thumb]).filter(Boolean));
    const gone = [...(old ? old.players.flatMap(p => [p.image, p.thumb]) : []), ...state.grpUploaded].filter(id => isAssetId(id) && !keep.has(id));

}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.roll) {
    const entry = t.closest('[data-entry]');
    let label = t.dataset.label || (entry && entry.dataset.entry) || '';
    if (!label) label = t.dataset.kind === 'attack' ? 'Attack' : t.dataset.kind === 'check' ? 'Check' : 'Damage';
    else if (t.dataset.kind === 'attack') label += ' (hit)';
    else if (t.dataset.kind === 'damage' && entry) label += ' (dmg)';
    // Rolled from a monster's stat block in the initiative tracker? Then it belongs to that combatant.
    let who = null;
    if (t.closest('#initSbBody, #sbSheetBody')) {
      const c = encFind(t.closest('#sbSheetBody') ? state.sheetId : (state.encSel && encFind(state.encSel) ? state.encSel : state.enc.turnId));
      if (c && c.kind === 'monster') who = c.name;
    }
    doRoll(t.dataset.roll, label, who);
    return;
  }
  if (t.dataset.open) return openMonster(t.dataset.open);
  if (t.dataset.type) { state.type = t.dataset.type; renderList(); return; }
  if (t.dataset.mode) {
    state.mode = t.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
    return;
  }
  if (t.dataset.add) return addRow(t.dataset.add, undefined, true);
  if (t.hasAttribute('data-remove')) return t.closest('.erow').remove();
  if (t.hasAttribute('data-sremove')) { t.closest('.srow').remove(); updateSkillAutos(); return; }
  if (t.dataset.pk != null && t.closest('.picker')) {
    const key = t.closest('.picker').id.slice(3);
    const on = t.getAttribute('aria-pressed') !== 'true';
    if (!on && t.hasAttribute('data-custom')) t.remove(); else t.setAttribute('aria-pressed', String(on));
    pickerSummary(key); return;
  }
  if (t.dataset.pkAdd) return pickerAdd(t.dataset.pkAdd);
  if (t.dataset.lvl) {
    t.closest('.seg').querySelectorAll('[data-lvl]').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    updateSkillAutos(); return;
  }
  if (t.dataset.die) return doRoll(t.dataset.die, t.dataset.die);
  if (t.dataset.zoom) { $('#lightImg').src = imgSrc(t.dataset.zoom); $('#lightbox').hidden = false; return; }
  // books
  if (t.dataset.book) { state.book = t.dataset.book; ls.set('pb-book', state.book); renderList(); $('#listPane').scrollTop = 0; return; }
  if (t.dataset.bk) { t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')); return; }
  if (t.dataset.bcolor) { state.bookColor = t.dataset.bcolor; renderBookColors(); return; }
  if (t.dataset.fs) {
    ls.set('pb-fs', t.dataset.fs); applyPrefs(); renderSettings();
    document.documentElement.style.setProperty('--tray-h', $('#tray').offsetHeight + 'px');
    return;
  }
  if (t.dataset.tobook) return openQuickBooks(t.dataset.tobook);
  if (t.dataset.qb) return toggleQuickBook(t.dataset.qb);
  // initiative tracker
  if (t.dataset.tabGo) return setTab(t.dataset.tabGo);
  if (t.dataset.pick) { const pm = state.monsters.find(x => x.id === t.dataset.pick); if (pm) { addMonsterToFight(pm); renderPickList(); } return; }
  if (t.dataset.cbHp) { state.hpOpen = state.hpOpen === t.dataset.cbHp ? null : t.dataset.cbHp; renderEncounter(); if (state.hpOpen) { const i = document.getElementById('amt-row-' + state.hpOpen); if (i) i.focus(); } return; }
  if (t.dataset.cbDmg) return changeHp(t.dataset.cbDmg, 'dmg', t.closest('.cb-hp').querySelector('input'));
  if (t.dataset.cbHeal) return changeHp(t.dataset.cbHeal, 'heal', t.closest('.cb-hp').querySelector('input'));
  if (t.dataset.cbFull) return changeHp(t.dataset.cbFull, 'full');
  if (t.dataset.cbDel) return removeFromFight(t.dataset.cbDel);
  // player groups
  if (t.dataset.grpAdd) return startGroupInit(t.dataset.grpAdd);
  if (t.dataset.grpEdit) { const g = state.groups.find(x => x.id === t.dataset.grpEdit); if (g) editGroup(g); return; }
  if (t.dataset.ppic) { if (t.closest('.prow') && !t.textContent.includes('…')) { state.grpPicFor = t.dataset.ppic; $('#grpFile').click(); } return; }
  if (t.dataset.prm) { readGrpNames(); state.grp.players = state.grp.players.filter(p => p.id !== t.dataset.prm); renderGrpPlayers(); return; }
  if (t.dataset.pcFill) { $('#pcName').value = t.dataset.pcFill; $('#pcInit').focus(); return; }
  if (t.dataset.cbSb) {
    state.encSel = t.dataset.cbSb;
    if (wide()) { renderEncounter(); $('#initSide').scrollTop = 0; }
    else { state.sheetId = t.dataset.cbSb; $('#sbSheet').hidden = false; $('#sbSheet').scrollTop = 0; renderEncounter(); }
    return;
  }
  const m = state.monsters.find(x => x.id === state.selectedId);
  switch (t.dataset.act) {
    case 'new': if (state.canWrite) openEditor(null); break;
    case 'edit': if (m) openEditor(m, m.id); break;
    case 'dup': if (m) { const { id, ...c } = m; openEditor({ ...c, name: c.name + ' (copy)', createdAt: Date.now() }, null); } break;
    case 'close-editor': askLeave(); break;
    case 'leave-stay': $('#leave').hidden = true; break;
    case 'leave-discard': closeEditor(); break;
    case 'leave-save': $('#leave').hidden = true; $('#edForm').requestSubmit(); break;
    case 'notes-format': toggleNotesFormat(); break;
    case 'paste-fill': pasteFill(); break;
    case 'paste-stop': if (readCtl) readCtl.abort(); break;
    case 'add-skill': addSkillRow(null, true); break;
    case 'add-save': addSaveRow(null, true); break;
    case 'add-sense': addSenseRow(null, true); break;
    case 'add-speed': addSpeedRow(null, true); break;
    case 'pic-remove': state.edImage = ''; state.edThumb = ''; renderPic(); break;
    case 'back': setView('list'); break;
    case 'delete': if (m) { state.pendingDelete = m.id; showConfirm(`Delete ${m.name}? This removes it from every device.`, 'Delete', null); } break;
    case 'confirm-no': $('#confirm').hidden = true; state.pendingDelete = null; state.confirmFn = null; break;
    case 'turn-next': moveTurn(1); break;
    case 'send-rolls': clearTimeout(playersTimer); publishPlayers(); break;
    case 'turn-prev': moveTurn(-1); break;
    case 'pv-share':
      $('#pvLink').value = SITE ? location.origin + location.pathname + '#players' : PLAYER_URL;
      if (SITE) $('#pvSteps').innerHTML = '<li>Send players the link below. They don’t need an account.</li><li>Their screen changes by itself the moment you press <b>Start</b>, <b>Next</b> or <b>Prev</b>, or roll from a monster’s stat block.</li>';
      $('#pvSheet').hidden = false; break;
    case 'dm-signin': SITE.signIn().catch(() => toast('Sign-in didn’t finish. Try again.')); break;
    case 'dm-signout': SITE.signOut(); break;
    case 'site-export': exportForSite(); break;
    case 'pv-close': $('#pvSheet').hidden = true; break;
    case 'pv-copy': {
      const inp = $('#pvLink');
      try { await navigator.clipboard.writeText(inp.value); toast('Link copied'); }
      catch { inp.focus(); inp.select(); toast('Selected. Copy it with your device’s copy command.'); }
      break;
    }
    case 'pv-preview': $('#pvSheet').hidden = true; state.previewPlayer = true; setRole('player'); renderPlayerView(publicEnc()); break;
    case 'pv-exit': state.previewPlayer = false; setRole('dm'); setTab('init'); break;
    case 'book-new': openBookDlg(null); break;
    case 'book-edit': { const b = state.books.find(x => x.id === state.book); if (b) openBookDlg(b); break; }
    case 'book-cancel': $('#bookSheet').hidden = true; if (state.quickFor) $('#qbSheet').hidden = false; break;
    case 'qb-close': closeQuickBooks(); break;
    case 'qb-newbook': $('#qbSheet').hidden = true; openBookDlg(null); break;
    case 'book-delete': {
      const b = state.books.find(x => x.id === state.bookEditing); if (!b) break;
      $('#bookSheet').hidden = true;
      const n = state.monsters.filter(x => inBook(x, b.id)).length;
      showConfirm(`Delete the book “${b.name}”? ${n ? `Its ${n} monster${n === 1 ? '' : 's'} stay in your bestiary.` : ''}`, 'Delete book', () => deleteBook(b.id));
      break;
    }
    case 'set-open': renderSettings(); $('#setSheet').hidden = false; break;
    case 'set-close': $('#setSheet').hidden = true; break;
    case 'set-backup': $('#setSheet').hidden = true; openBackup(); break;
    case 'toggle-dark': {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next; ls.set('pb-theme', next); renderSettings();
      break;
    }
    case 'grp-open': openGroups(); break;
    case 'grp-close': $('#grpSheet').hidden = true; break;
    case 'grp-new': editGroup(null); break;
    case 'grp-back': if (state.grpViewName === 'edit') cancelGroupEdit(); else { renderGroups(); grpView('list'); } break;
    case 'grp-cancel': cancelGroupEdit(); break;
    case 'grp-add-player': {
      readGrpNames();
      const np = { id: uid(), name: '', image: '', thumb: '' };
      state.grp.players.push(np); renderGrpPlayers();
      const inp = document.getElementById('pn-' + np.id); if (inp) inp.focus();
      break;
    }
    case 'grp-delete': {
      const g = state.groups.find(x => x.id === (state.grp && state.grp.id)); if (!g) break;
      showConfirm(`Delete the group “${g.name}”? Players already in a fight stay there.`, 'Delete group', () => deleteGroup(g.id));
      break;
    }
    case 'pc-open': $('#pcName').value = ''; $('#pcInit').value = ''; renderPcSheet(); $('#pcSheet').hidden = false; $('#pcName').focus(); break;
    case 'pc-close': $('#pcSheet').hidden = true; break;
    case 'pick-open': $('#pickQ').value = ''; renderPickList(); $('#pickSheet').hidden = false; break;
    case 'pick-close': $('#pickSheet').hidden = true; break;
    case 'sb-close': $('#sbSheet').hidden = true; state.sheetId = null; break;
    case 'enc-clear':
      showConfirm('Clear the encounter? Everyone is removed from the tracker and from the players’ screen.', 'Clear', () => {
        state.enc = { list: [], round: 0, turnId: null, log: [], pubAt: state.enc.pubAt || 0 }; state.encSel = null; state.hpOpen = null; encChanged();
        schedulePlayersUpdate(300);  // players' screen goes back to "No fight yet" too
      });
      break;
    case 'confirm-yes': {
      $('#confirm').hidden = true;
      if (state.confirmFn) { const fn = state.confirmFn; state.confirmFn = null; fn(); break; }
      const id = state.pendingDelete; state.pendingDelete = null;
      if (!id || !state.db) return;
      const gone = state.monsters.find(x => x.id === id) || {};
      const name = gone.name;
      try { await state.db.collection('monsters').doc(id).delete(); ls.set(hpKey(id), null); dropAsset(gone.image, id); dropAsset(gone.thumb, id); state.selectedId = null; setView('list'); renderList(); renderDetail(); toast(`Deleted ${name}`); }
      catch (e) { toast(saveErrorText(e)); }
      break;
    }
    case 'dmg': case 'heal': {
      if (!m) break;
      const amt = Math.abs(parseInt($('#hpAmt').value, 10) || 0); if (!amt) { $('#hpAmt').focus(); break; }
      const now = getHp(m);
      const next = t.dataset.act === 'dmg' ? Math.max(0, now - amt) : Math.min(m.hp, now + amt);
      ls.set(hpKey(m.id), next); $('#hpAmt').value = ''; renderHp(m);
      break;
    }
    case 'hpreset': if (m) { ls.set(hpKey(m.id), null); renderHp(m); } break;
    case 'backup': openBackup(); break;
    case 'close-backup': $('#backup').hidden = true; break;
  }
});
$('#trayToggle').addEventListener('click', e => {
  const more = $('#trayMore'); more.hidden = !more.hidden;
  e.currentTarget.setAttribute('aria-expanded', String(!more.hidden));
});
// Track the dice tray's height (it grows when expanded) so popups can stop above it.
(() => {
  const tray = $('#tray');
  const setH = () => {
    const h = tray.offsetHeight + 'px';
    document.documentElement.style.setProperty('--tray-h', h);
    $('#sbSheet').style.bottom = `calc(${h} + env(safe-area-inset-bottom, 0px))`;
  };
  setH();
  if ('ResizeObserver' in window) new ResizeObserver(setH).observe(tray);
  else addEventListener('resize', setH);
})();
$('#quick').innerHTML = ['d4','d6','d8','d10','d12','d20','d100','2d6','4d6'].map(d => `<button type="button" data-die="${d}">${d}</button>`).join('');
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; ls.set('pb-sort', state.sort); renderList(); });
$('#edForm').addEventListener('submit', saveEditor);
$('#f-pic').addEventListener('change', onPickPicture);
$('#lightbox').addEventListener('click', () => { $('#lightbox').hidden = true; });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#lightbox').hidden) $('#lightbox').hidden = true;
  else if (!$('#setSheet').hidden) $('#setSheet').hidden = true;
  else if (!$('#leave').hidden) $('#leave').hidden = true;
  else if (!$('#confirm').hidden) $('#confirm').hidden = true;
  else if (!$('#bookSheet').hidden) { $('#bookSheet').hidden = true; if (state.quickFor) $('#qbSheet').hidden = false; }
  else if (!$('#qbSheet').hidden) closeQuickBooks();
  else if (!$('#pvSheet').hidden) $('#pvSheet').hidden = true;
  else if (state.previewPlayer) { state.previewPlayer = false; setRole('dm'); setTab('init'); }
  else if (!$('#editor').hidden) { e.preventDefault(); askLeave(); }
  else if (!$('#backup').hidden) $('#backup').hidden = true;
  else if (!$('#sbSheet').hidden) { $('#sbSheet').hidden = true; state.sheetId = null; }
  else if (!$('#pickSheet').hidden) $('#pickSheet').hidden = true;
  else if (!$('#pcSheet').hidden) $('#pcSheet').hidden = true;
  else if (!$('#grpSheet').hidden) {
    if (state.grpViewName === 'edit') cancelGroupEdit();
    else if (state.grpViewName === 'init') { renderGroups(); grpView('list'); }
    else $('#grpSheet').hidden = true;
  }
});
// Pasting a picture: into the "tap here and paste" box, or Ctrl+V anywhere in the editor outside a text box.
$('#picPaste').addEventListener('paste', e => {
  e.preventDefault();
  const img = pastedImage(e);
  if (img) uploadPicture(img); else renderPic('That was text, not a picture. Copy an image first, then paste it here.');
  e.currentTarget.textContent = '';
});
$('#picPaste').addEventListener('input', e => { e.currentTarget.textContent = ''; });  // never keep typed text in the box
$('#editor').addEventListener('paste', e => {
  if (e.target.closest('#picPaste, #pasteTxt')) return;  // handled by their own listeners
  const img = pastedImage(e);
  if (!img) return;  // ordinary text paste
  const inText = e.target.matches('input, textarea, [contenteditable="true"]');
  const hasText = e.clipboardData && e.clipboardData.getData('text/plain');
  if (inText && hasText) return;  // pasting text into a field: leave it alone
  e.preventDefault();
  uploadPicture(img);
  $('#picField').scrollIntoView({ block: 'nearest' });
});
// Player pictures in Groups: paste into a row's "Paste" box, or Ctrl+V while on that row (or after tapping its picture).
$('#grpPlayers').addEventListener('input', e => { const z = e.target.closest('[data-ppaste]'); if (z) z.textContent = ''; });
$('#grpSheet').addEventListener('paste', e => {
  if (!state.grp || $('#grpEdit').hidden) return;
  const zone = e.target.closest && e.target.closest('[data-ppaste]');
  const img = pastedImage(e);
  if (zone) {
    e.preventDefault(); zone.textContent = '';
    if (img) uploadPlayerPic(zone.dataset.ppaste, img);
    else showErr('#grpErr', 'That was text, not a picture. Copy an image first, then paste it into the Paste box.');
    return;
  }
  if (!img) return;  // ordinary text paste (player names, group name)
  const hasText = e.clipboardData && e.clipboardData.getData('text/plain');
  const row = e.target.closest && e.target.closest('.prow');
  if (e.target.matches('input') && hasText) return;
  // which player: the row being edited, else the last picture square tapped, else the first player without a picture
  const pid = row ? row.dataset.pid
    : (state.grp.players.some(p => p.id === state.grpPicFor) ? state.grpPicFor : (state.grp.players.find(p => !isAssetId(p.image)) || {}).id);
  if (!pid) return;
  e.preventDefault();
  uploadPlayerPic(pid, img);
});
// Typing after Auto-format makes that text the new original (Undo would otherwise throw the typing away).
$('#f-notes').addEventListener('input', () => { if (notesUndo != null) { notesUndo = null; $('#notesFmtBtn').textContent = 'Auto-format'; } });
$('#pasteImg').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) readPicture(f); });
$('#pasteTxt').addEventListener('paste', e => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => f.type.startsWith('image/'));
  if (!files.length || !state.sampleImages) return;  // plain text pastes normally
  e.preventDefault();
  readPicture(files[0]);
});
$('#grpEdit').addEventListener('submit', saveGroup);
$('#grpInit').addEventListener('submit', addGroupToFight);
$('#grpFile').addEventListener('change', onGrpFile);
// Enter in a player-name or initiative box jumps to the next one (and adds a new row / submits at the end).
$('#grpEdit').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.closest('.prow')) return;
  e.preventDefault();
  const inputs = [...document.querySelectorAll('#grpPlayers .prow input')], i = inputs.indexOf(e.target);
  if (i < inputs.length - 1) inputs[i + 1].focus(); else document.querySelector('[data-act="grp-add-player"]').click();
});
$('#grpInit').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  const inputs = [...document.querySelectorAll('#grpInitRows input:not([disabled])')], i = inputs.indexOf(e.target);
  if (i < inputs.length - 1) { e.preventDefault(); inputs[i + 1].focus(); }
});
$('#bookForm').addEventListener('submit', saveBook);
$('#bookName').addEventListener('input', updateBookPreview);
$('#pcForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = str($('#pcName').value), init = intOrNull($('#pcInit').value);
  if (!name) { $('#pcName').focus(); return; }
  if (init == null) { $('#pcInit').focus(); toast('Enter the player’s initiative roll.'); return; }
  addPc(name.slice(0, 40), init);
  rememberPlayer(name.slice(0, 40));
  toast(`Added ${name} (${init})`);
  $('#pcName').value = ''; $('#pcInit').value = ''; $('#pcName').focus();
  renderPcSheet();
});
$('#cbList').addEventListener('change', e => {
  const id = e.target.dataset.cbInit; if (!id) return;
  const c = encFind(id), v = intOrNull(e.target.value);
  if (c && v != null && v !== c.init) { c.init = v; encChanged(); }
});
$('#cbList').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.cb-init')) e.target.blur();
});
$('#pickQ').addEventListener('input', renderPickList);
$('#siteImportFile').addEventListener('change', e => importFile(e.target.files && e.target.files[0]));

/* ---------- boot ---------- */
async function waitForClaude() {
  for (let i = 0; i < 25; i++) {
    if (window.claude && typeof window.claude.use === 'function') return window.claude;
    await new Promise(r => setTimeout(r, 200));
  }
  return null;
}
async function connect() {
  const c = await waitForClaude();
  if (!c && state.role === 'boot') { showPlayers(); return; }  // never used as the DM on this device: a visitor
  if (!c) { state.loaded = true; setSync(state.monsters.length ? 'Offline copy' : 'Offline', 'warn'); setReadOnly(); return; }
  const [db, user, assets] = await Promise.all([c.use('db'), c.use('user'), c.use('assets')]);
  state.assets = assets;
  // Who is this? The owner (and anyone who can edit) runs the full app; everyone else gets the player view.
  let dm = false;
  if (user) { try { dm = !!(await user.isOwner()) || !!(await user.canEdit()); } catch {} }
  else if (db) { try { dm = !(await db.collection('monsters').limit(1).get()).empty; } catch {} }
  if (!dm) { showPlayers(); return; }
  setRole('dm');
  if (!db) { state.loaded = true; setSync('Not connected · read-only', 'warn'); setReadOnly(); return; }
  state.db = db;
  try { state.artifact = await c.use('artifact'); } catch { state.artifact = null; }
  // Picture reading for the stat block importer (owner only; spends their own Claude usage, asks first)
  try {
    state.sample = await c.use('sample');
    const lim = state.sample ? await state.sample.limits().catch(() => null) : null;
    state.sampleImages = !!(lim && lim.images);
  } catch { state.sample = null; state.sampleImages = false; }
  $('#pasteImgRow').hidden = !state.sampleImages;
  if (unsentRolls()) schedulePlayersUpdate(800);
  if (user) {
    try { const w = await user.can('data.write'); if (w === false) setReadOnly(); } catch {}
  }
  setSync('Syncing…', 'idle');
  encSubscribe(db);
  db.collection('groups').onSnapshot(snap => {
    state.groups = snap.docs.map(d => { const g = d.data(); return { id: d.id, name: str(g.name) || 'Group', players: cleanPlayers(g.players), createdAt: g.createdAt }; });
    ls.set('pb-groups', state.groups);
    if (!$('#grpSheet').hidden && state.grpViewName === 'list') renderGroups();
  }, () => {});
  db.collection('books').onSnapshot(snap => {
    state.books = snap.docs.map(d => ({ ...d.data(), id: d.id })).filter(b => b.name);
    ls.set('pb-books', state.books);
    renderList(); renderDetail();
  }, () => {});
  db.collection('monsters').onSnapshot(snap => {
    state.monsters = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    state.loaded = true;
    ls.set('pb-cache', state.monsters);
    setSync(snap.metadata.fromCache ? 'Syncing…' : 'Synced', snap.metadata.fromCache ? 'idle' : 'live');
    renderList(); renderDetail();
    if ($('#app').dataset.tab === 'init') renderEncounter();
    if (!$('#pickSheet').hidden) renderPickList();
    if (!snap.metadata.fromCache) { setTimeout(backfillThumbs, 1500); setTimeout(syncPlayersIfStale, 2500); }
  }, err => {
    setSync(err.code === 'revoked' ? 'Access changed · read-only' : 'Sync stopped · reload to retry', 'warn');
    if (err.code === 'revoked') setReadOnly();
  });
}

buildEditorStatic();
state.sort = ls.get('pb-sort', 'name'); $('#sort').value = state.sort;
state.monsters = ls.get('pb-cache', []) || [];
state.enc = cleanEnc(ls.get('pb-enc', null));
state.role = 'boot'; state.previewPlayer = false;
// The player link (…#players) always opens the player screen, even for the DM (handy for a TV).
const playerLink = location.hash === '#players';
// This device has been used by the DM before: show the app right away instead of waiting.
if (!playerLink && (ls.get('pb-role', '') === 'dm' || (ls.get('pb-cache', []) || []).length)) setRole('dm');
state.books = (ls.get('pb-books', []) || []).filter(b => b && b.id && b.name);
state.groups = (ls.get('pb-groups', []) || []).filter(g => g && g.id).map(g => ({ ...g, players: cleanPlayers(g.players) }));
state.book = ls.get('pb-book', 'all') || 'all';
renderList(); renderDetail(); renderTray();
setTab(ls.get('pb-tab', 'bestiary') === 'init' ? 'init' : 'bestiary');
renderEncounter();
if (!playerLink) restoreScreen();
if (playerLink) showPlayers(); else connect();
})();
